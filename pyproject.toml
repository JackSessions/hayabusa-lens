[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hayabusa-lens"
version = "0.1.0"
description = "An unofficial point-and-click front end for Hayabusa: scan Windows event logs, explore detections, zoom the timeline, export reports"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
authors = [{ name = "Jack Sessions" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dfir", "hayabusa", "evtx", "sigma", "threat-hunting", "forensics", "timeline", "gui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/JackSessions/hayabusa-lens"
Source = "https://github.com/JackSessions/hayabusa-lens"
Issues = "https://github.com/JackSessions/hayabusa-lens/issues"

[project.scripts]
hayabusa-lens = "hayabusa_lens.cli:main"

[tool.setuptools]
packages = ["hayabusa_lens"]
