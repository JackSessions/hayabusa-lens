[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hayabusa-lens"
version = "0.9.0"
description = "Find what happened in Windows event logs: a dashboard for Hayabusa and Chainsaw, a 3D attack map, and an AI investigator that keeps an audit trail of every question it asks"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
authors = [{ name = "Jack Sessions" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dfir", "hayabusa", "chainsaw", "evtx", "sigma", "mitre-attack", "threat-hunting", "forensics", "timeline", "incident-response", "ollama", "llm", "audit-trail", "blue-team"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Logging",
]

[project.urls]
Homepage = "https://github.com/JackSessions/hayabusa-lens"
Source = "https://github.com/JackSessions/hayabusa-lens"
Issues = "https://github.com/JackSessions/hayabusa-lens/issues"
Changelog = "https://github.com/JackSessions/hayabusa-lens/blob/main/CHANGELOG.md"
Documentation = "https://github.com/JackSessions/hayabusa-lens#readme"

[project.scripts]
hayabusa-lens = "hayabusa_lens.cli:main"

[tool.setuptools]
packages = ["hayabusa_lens"]

[tool.setuptools.package-data]
hayabusa_lens = ["starter/*.yml"]
