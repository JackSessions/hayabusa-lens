title: Certutil Used To Download A File
id: d33fab59-f5e0-5607-8044-f4806dc9d4f8
status: example
description: Hayabusa Lens starter rule (an original, simplified example): certutil can download files and is abused as a download tool.
author: Hayabusa Lens
date: 2026-10-03
tags:
  - attack.command_and_control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\certutil.exe'
    CommandLine|contains: 'urlcache'
  condition: selection
falsepositives:
  - Legitimate administration
level: medium
